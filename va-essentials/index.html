<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VA Essentials — LSH Standard Training</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#262B45;
  --navy-deep:#161829;
  --orange:#DB8437;
  --orange-deep:#B5651F;
  --bg:#EEF0F6;
  --paper:#FFFFFF;
  --ink:#1B1E2E;
  --ink-soft:#5B6178;
  --line:#DCE0EA;
  --radius:14px;
  --shadow:0 1px 2px rgba(22,24,41,.04), 0 8px 24px -12px rgba(22,24,41,.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
header{
  background:var(--navy);
  color:#fff;
  border-bottom:3px solid var(--orange);
}
.bar{
  max-width:1200px;
  margin:0 auto;
  padding:18px 16px;
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}
.bar img{width:36px;height:36px;border-radius:8px;}
.eyebrow{
  font-size:12px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--orange);
}
h1{
  margin:0;
  font-family:'Fraunces',Georgia,serif;
  font-weight:700;
  font-size:26px;
  line-height:1.15;
}
main{
  flex:1;
  width:100%;
  max-width:1200px;
  margin:0 auto;
  padding:24px 16px 32px;
}
.lesson{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:12px;
}
/* Canva's own embed layout: a 16:9 box the design scales into. */
.canva-frame{
  position:relative;
  width:100%;
  height:0;
  padding-top:56.25%;
  overflow:hidden;
  border-radius:8px;
  background:var(--navy-deep);
}
.canva-frame iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:none;
}
.actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:14px;
  font-size:14px;
  color:var(--ink-soft);
}
.btn{
  display:inline-block;
  padding:9px 16px;
  border-radius:999px;
  background:var(--orange);
  color:#fff;
  font-weight:600;
  font-size:14px;
  text-decoration:none;
  border:none;
  cursor:pointer;
  font-family:inherit;
}
.btn:hover{background:var(--orange-deep);}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--line);}
.btn.ghost:hover{background:var(--bg);}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}
footer{
  text-align:center;
  font-size:12px;
  color:var(--ink-soft);
  padding:0 16px 24px;
}
@media (max-width:600px){
  h1{font-size:22px;}
  .lesson{padding:8px;}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <img src="/favicon.png" alt="">
    <div>
      <div class="eyebrow">LSH Standard Training</div>
      <h1>VA Essentials</h1>
    </div>
  </div>
</header>

<main>
  <section class="lesson" aria-label="VA Essentials lesson">
    <div class="canva-frame" id="canvaFrame">
      <iframe
        id="canvaEmbed"
        loading="lazy"
        title="VA Essentials lesson (Canva)"
        src="https://www.canva.com/design/DAGnZTxmWyk/sLRwYE5XE5EhyZvY98iQ2Q/view?embed"
        allowfullscreen="allowfullscreen"
        allow="fullscreen">
      </iframe>
    </div>
    <div class="actions">
      <span>Use the arrows in the lesson to move between slides.</span>
      <div class="btn-row">
        <button class="btn ghost" type="button" id="fullscreenBtn">⛶ Full screen</button>
        <a class="btn" href="https://www.canva.com/design/DAGnZTxmWyk/sLRwYE5XE5EhyZvY98iQ2Q/view" target="_blank" rel="noopener noreferrer">Open in Canva ↗</a>
      </div>
    </div>
  </section>
</main>

<footer>Legal Support Help · VA Essentials</footer>

<script>
document.getElementById("fullscreenBtn").addEventListener("click", function(){
  var el = document.getElementById("canvaFrame");
  var req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (req) req.call(el);
});
</script>
</body>
</html>
