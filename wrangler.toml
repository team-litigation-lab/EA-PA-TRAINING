name = "ea-pa-training"
compatibility_date = "2024-09-23"
main = "worker.js"

[assets]
directory = "."
binding = "ASSETS"

[[kv_namespaces]]
binding = "LSH_KV"
id = "b121aa911590471bbad351d03274d7f4"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "lshtraining"

[version_metadata]
binding = "CF_VERSION_METADATA"

# Run the Worker from a US region (Gemini rejects some Asian regions).
[placement]
mode = "targeted"
region = "gcp:us-central1"

# Gemini calls refused for the caller's region are sent again from this Durable Object, pinned to the US.
[[durable_objects.bindings]]
name = "GEMINI_RELAY"
class_name = "GeminiRelay"

[[migrations]]
tag = "v1-gemini-relay"
new_sqlite_classes = ["GeminiRelay"]
