# Checks for the Property Damage Claims course in pd-training/ (its own Worker).
# Runs on pull requests and pushes to main that touch pd-training/. Nothing here deploys.
name: PD Training Checks

on:
  pull_request:
    paths: ['pd-training/**', '.github/workflows/pd-training.yml']
  push:
    branches: [main]
    paths: ['pd-training/**', '.github/workflows/pd-training.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pd-checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: pd-training

jobs:
  checks:
    name: PD — syntax, files, documents and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: JavaScript syntax, local files, JSON
        run: node .github/scripts/check-site.mjs
      - name: Claim documents and handouts exist, document references resolve
        run: node .github/scripts/check-data.mjs
      - name: Build the Worker without deploying (wrangler dry run)
        run: npx --yes wrangler@4 deploy --dry-run --outdir "$RUNNER_TEMP/dist"

  smoke:
    name: PD — smoke test in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Sign in, render every day, page and Skill Builder (desktop and phone)
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          node .github/scripts/server.mjs 8787 > "$RUNNER_TEMP/server.log" 2>&1 &
          sleep 2
          node .github/scripts/smoke.cjs http://localhost:8787/ || { echo "--- server log ---"; cat "$RUNNER_TEMP/server.log"; exit 1; }
