- name: Debug wrangler.json
  run: |
    echo "=== current working dir ==="
    pwd
    echo "=== listing top-level files ==="
    ls -la
    echo "=== show wrangler.json ==="
    if [ -f wrangler.json ]; then cat wrangler.json; else echo "no wrangler.json"; fi
    echo "=== find other wrangler.* files (maxdepth 3) ==="
    find . -maxdepth 3 -type f -iname 'wrangler.*' || true
    echo "=== git tracked wrangler files ==="
    git ls-files | grep -i wrangler || true

- name: Deploy with Wrangler (explicit assets directory)
  env:
    CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  run: |
    # Use the explicit assets flag so Wrangler doesn't require a Worker entrypoint
    npx --yes wrangler deploy --assets=./
