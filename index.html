<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LSH EA/PA Upskill Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --navy:#262B45;
  --navy-deep:#161829;
  --navy-soft:#3C4268;
  --orange:#DB8437;
  --orange-deep:#B5651F;
  --orange-soft:#F0C08A;
  --bg:#EEF0F6;
  --paper:#FFFFFF;
  --ink:#1B1E2E;
  --ink-soft:#5B6178;
  --line:#DCE0EA;
  --success:#3F7D58;
  --success-bg:#E7F1EA;
  --danger:#B54A3F;
  --danger-bg:#F7E9E6;
  --radius:14px;
  --shadow:0 1px 2px rgba(22,24,41,.04), 0 8px 24px -12px rgba(22,24,41,.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
h1,h2,h3,h4,.display{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.005em;font-weight:600;}
.mono{font-family:'IBM Plex Mono',monospace;letter-spacing:.02em;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--orange-soft);}

/* ---------- layout shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}

.topbar{
  background:var(--navy);
  color:#fff;
  position:sticky;top:0;z-index:40;
  box-shadow:0 2px 16px rgba(0,0,0,.15);
}
.topbar-inner{
  max-width:1120px;margin:0 auto;padding:14px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
.brand-mark{width:38px;height:38px;flex:0 0 auto;object-fit:contain;}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-text b{font-family:'Fraunces';font-size:15px;letter-spacing:.01em;}
.brand-text span{font-size:11px;color:#B9BEDA;text-transform:uppercase;letter-spacing:.09em;}

.nav{display:flex;gap:4px;background:rgba(255,255,255,.06);padding:4px;border-radius:10px;}
.nav button{
  background:transparent;border:none;color:#D7DAEC;font-size:13.5px;font-weight:600;
  padding:8px 14px;border-radius:7px;transition:all .15s ease;
}
.nav button.active{background:var(--orange);color:#241304;}
.nav button:not(.active):hover{background:rgba(255,255,255,.09);color:#fff;}

.trainee-chip{
  display:flex;align-items:center;gap:8px;font-size:12.5px;color:#C9CCE6;
  border:1px solid rgba(255,255,255,.18);padding:6px 10px;border-radius:20px;cursor:pointer;
}
.trainee-chip:hover{border-color:rgba(255,255,255,.4);}
.trainee-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--orange);}

main{flex:1;max-width:1120px;margin:0 auto;padding:36px 24px 80px;width:100%;}

.footer-note{
  text-align:center;font-size:11.5px;color:var(--ink-soft);padding:26px 24px 40px;
}

/* ---------- generic building blocks ---------- */
.eyebrow{
  font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--orange-deep);margin:0 0 8px;
}
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.btn{
  display:inline-flex;align-items:center;gap:8px;border-radius:9px;border:1px solid transparent;
  font-weight:600;font-size:13.5px;padding:10px 18px;transition:all .15s ease;
}
.btn-primary{background:var(--orange);color:#241304;}
.btn-primary:hover{background:var(--orange-deep);color:#fff;}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink);}
.btn-ghost:hover{border-color:var(--navy-soft);background:#F6F7FB;}
.btn-navy{background:var(--navy);color:#fff;}
.btn-navy:hover{background:var(--navy-deep);}
.btn[disabled]{opacity:.42;cursor:not-allowed;pointer-events:none;}
.btn-sm{padding:7px 13px;font-size:12.5px;}

.pill{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  padding:4px 10px;border-radius:20px;letter-spacing:.03em;text-transform:uppercase;
}
.pill-locked{background:#E4E6EE;color:#7C82A0;}
.pill-open{background:#E4E9FB;color:#33437E;}
.pill-done{background:var(--success-bg);color:var(--success);}

/* ---------- hero / dashboard ---------- */
.hero{
  display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center;
  margin-bottom:44px;
}
@media(max-width:820px){.hero{grid-template-columns:1fr;}}
.hero h1{font-size:34px;margin:0 0 14px;color:var(--navy);}
.hero p{color:var(--ink-soft);font-size:15px;max-width:52ch;margin:0 0 22px;}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;}
.hero-seal-wrap{display:flex;justify-content:center;}

.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:38px;}
@media(max-width:720px){.stat-row{grid-template-columns:repeat(2,1fr);}}
.stat{padding:18px 18px;}
.stat .num{font-family:'Fraunces';font-size:26px;color:var(--navy);}
.stat .lbl{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.07em;margin-top:2px;}

.timeline{position:relative;padding-left:2px;}
.day-row{
  display:grid;grid-template-columns:64px 1fr auto;gap:18px;align-items:center;
  padding:18px 20px;margin-bottom:12px;position:relative;
}
.day-row.locked{opacity:.55;}
.day-num{
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces';font-weight:700;font-size:16px;flex:0 0 auto;
  background:var(--navy);color:#fff;justify-self:center;
}
.day-row.done .day-num{background:var(--success);}
.day-row.locked .day-num{background:#C9CCDC;color:#fff;}
.day-body h3{margin:0 0 4px;font-size:16.5px;color:var(--navy);}
.day-body p{margin:0;font-size:13px;color:var(--ink-soft);}
.day-meta{display:flex;align-items:center;gap:10px;}
.score-tag{font-family:'IBM Plex Mono';font-size:12px;color:var(--ink-soft);}

/* ---------- seal (signature element) ---------- */
.seal{filter:drop-shadow(0 6px 14px rgba(38,43,69,.18));}

/* ---------- day view ---------- */
.day-head{margin-bottom:28px;}
.day-head .eyebrow{color:var(--orange-deep);}
.day-head h1{color:var(--navy);font-size:28px;margin:6px 0 10px;}
.day-head p{color:var(--ink-soft);font-size:14.5px;max-width:70ch;margin:0;}
.back-link{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
  color:var(--ink-soft);margin-bottom:18px;
}
.back-link:hover{color:var(--navy);}

.lesson-grid{display:grid;gap:14px;margin-bottom:8px;}
.lesson-card{padding:20px 22px;}
.lesson-card h4{margin:0 0 10px;font-size:15.5px;color:var(--navy);display:flex;gap:10px;align-items:baseline;}
.lesson-card h4 .lnum{font-family:'IBM Plex Mono';font-size:12px;color:var(--orange-deep);}
.lesson-card ul{margin:0;padding-left:18px;}
.lesson-card li{font-size:13.6px;color:#37394A;margin-bottom:6px;}
.lesson-card li:last-child{margin-bottom:0;}

.section-title{
  font-family:'Fraunces';font-size:19px;color:var(--navy);margin:38px 0 16px;
  display:flex;align-items:center;gap:10px;
}
.section-title .tag{
  font-family:'IBM Plex Mono';font-size:11px;background:var(--navy);color:#fff;
  padding:3px 8px;border-radius:5px;letter-spacing:.05em;
}

/* ---------- quiz ---------- */
.quiz-card{padding:22px 24px;margin-bottom:14px;}
.quiz-q{font-size:14.5px;font-weight:600;color:var(--navy);margin:0 0 12px;}
.quiz-opts{display:grid;gap:8px;}
.quiz-opt{
  display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:9px;
  padding:11px 13px;font-size:13.5px;transition:all .12s ease;
}
.quiz-opt:hover{border-color:var(--navy-soft);background:#F8F9FC;}
.quiz-opt input{margin-top:2px;accent-color:var(--orange);}
.quiz-opt.correct{border-color:var(--success);background:var(--success-bg);}
.quiz-opt.incorrect{border-color:var(--danger);background:var(--danger-bg);}
.quiz-rationale{
  font-size:12.8px;color:var(--ink-soft);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
  display:none;
}
.quiz-rationale.show{display:block;}

.quiz-result{
  padding:26px 26px;text-align:center;margin-top:6px;
}
.quiz-result .big{font-family:'Fraunces';font-size:42px;color:var(--navy);}
.quiz-result .sub{font-size:13.5px;color:var(--ink-soft);margin-top:4px;}

/* ---------- practice lab ---------- */
.tool-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
@media(max-width:760px){.tool-grid{grid-template-columns:1fr;}}
.tool-card{padding:22px 24px;display:flex;flex-direction:column;gap:10px;}
.tool-icon{
  width:38px;height:38px;border-radius:9px;background:var(--navy);color:var(--orange);
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.tool-card h3{margin:0;font-size:16.5px;color:var(--navy);}
.tool-card p{margin:0;font-size:13px;color:var(--ink-soft);flex:1;}
.tool-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}

.tool-shell{padding:26px 28px;}
.tool-shell .toolhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:16px;flex-wrap:wrap;}
.tool-shell h2{margin:0 0 6px;color:var(--navy);font-size:22px;}
.tool-shell .toolhead p{margin:0;color:var(--ink-soft);font-size:13.5px;max-width:64ch;}

/* ---------- delight: hover polish, tabs, confetti ---------- */
.card{transition:transform .15s ease, box-shadow .15s ease;}
.tool-card:hover, .day-row:hover, .handout-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px -8px rgba(38,43,69,.28);}
.btn{transition:transform .12s ease, background .15s ease, color .15s ease, box-shadow .15s ease;}
.btn:not([disabled]):hover{transform:translateY(-1px);box-shadow:0 4px 12px -4px rgba(38,43,69,.3);}
.btn:not([disabled]):active{transform:translateY(0);box-shadow:none;}
.nav button{transition:background .15s ease, color .15s ease, transform .12s ease;}
.quiz-opt{transition:transform .1s ease;}
.drill-btn{transition:transform .1s ease, background .15s ease;}
.drill-btn:not([disabled]):hover{transform:translateY(-1px);}

.tab-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.tab-btn{
  border:1px solid var(--line);background:#fff;color:var(--ink-soft);
  border-radius:20px;padding:8px 14px;font-size:12.3px;font-weight:700;
  transition:all .15s ease;
}
.tab-btn:hover{border-color:var(--navy-soft);color:var(--navy);transform:translateY(-1px);}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.task-panel ul{margin:0 0 4px;padding-left:18px;}
.task-panel li{font-size:13.4px;color:#37394A;margin-bottom:7px;line-height:1.5;}

@keyframes sealPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
.seal.pulse{animation:sealPulse 2s ease-in-out infinite;}

@keyframes confettiFall{
  0%{transform:translateY(-10px) rotate(0deg);opacity:1;}
  100%{transform:translateY(60vh) rotate(420deg);opacity:0;}
}
.confetti-piece{
  position:fixed;top:0;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:500;
  animation:confettiFall 1.5s ease-in forwards;
}

.legend-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.legend-chip{
  display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ink-soft);
  border:1px solid var(--line);border-radius:20px;padding:5px 10px 5px 8px;
}
.legend-chip .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto;}
.sweep-timer{
  font-family:'IBM Plex Mono';font-size:12px;color:var(--ink-soft);
  display:flex;align-items:center;gap:6px;
}

/* real-inbox email client: sidebar folder tree + email list */
.inbox-shell{display:grid;grid-template-columns:230px 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;min-height:420px;}
@media(max-width:760px){.inbox-shell{grid-template-columns:1fr;}}
.inbox-sidebar{background:#F6F7FB;border-right:1px solid var(--line);padding:10px 8px;}
.folder-item{
  display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 8px;border-radius:7px;
  font-size:12.8px;cursor:pointer;color:var(--ink);margin-bottom:2px;transition:background .12s ease;
}
.folder-item:hover{background:#E9EBF3;}
.folder-item.active{background:var(--navy);color:#fff;}
.folder-item.dragover{outline:2px dashed var(--orange);outline-offset:-2px;background:#FBF3E7;}
.folder-item .fname{display:flex;align-items:center;gap:7px;overflow:hidden;}
.folder-item .fname .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto;}
.folder-item .fname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.folder-item .fcount{font-family:'IBM Plex Mono';font-size:10.5px;opacity:.8;}
.folder-item .fcolor-input{width:12px;height:12px;padding:0;border:none;background:none;border-radius:50%;cursor:pointer;flex:0 0 auto;}
.folder-item .faddbtn{opacity:0;font-size:13px;padding:0 4px;border-radius:4px;flex:0 0 auto;}
.folder-item:hover .faddbtn{opacity:.7;}
.folder-item .faddbtn:hover{opacity:1;background:rgba(0,0,0,.08);}
.folder-children{margin-left:14px;border-left:1px dashed var(--line);padding-left:6px;}
.sidebar-section-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);padding:8px 8px 4px;}
.add-label-row{display:flex;gap:4px;padding:6px 4px;}
.add-label-row input{flex:1;padding:6px 8px;border-radius:6px;border:1px solid var(--line);font-size:12px;}
.add-label-btn{
  width:100%;text-align:left;padding:7px 8px;border-radius:7px;font-size:12.2px;color:var(--navy-soft);
  font-weight:600;background:none;border:none;
}
.add-label-btn:hover{background:#E9EBF3;color:var(--navy);}

.inbox-main{padding:14px 16px;}
.inbox-main-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.inbox-main-head h4{margin:0;font-size:14px;color:var(--navy);}
.mail-row{
  display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;
  padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;
  cursor:grab;background:#fff;transition:box-shadow .12s ease;
}
.mail-row:hover{box-shadow:0 3px 10px -3px rgba(0,0,0,.15);}
.mail-row:active{cursor:grabbing;}
.mail-row .subj{font-size:13.3px;font-weight:600;color:var(--ink);}
.mail-row .meta{font-size:11.3px;color:var(--ink-soft);margin-top:2px;}
.mail-row .chip{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;color:#fff;
  padding:3px 8px;border-radius:10px;margin-top:6px;width:fit-content;
}
.mail-row select{
  width:100%;padding:7px 8px;border-radius:7px;border:1px solid var(--line);font-size:12px;
  font-family:inherit;background:#fff;
}
.mail-row .unfile-btn{font-size:10.5px;color:var(--ink-soft);background:none;border:none;text-decoration:underline;padding:2px 0;margin-top:4px;cursor:pointer;}
.empty-folder{font-size:12.8px;color:var(--ink-soft);padding:30px 10px;text-align:center;}
.color-dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-left:6px;vertical-align:middle;}

/* differences drill */
.drill-row{
  display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
  padding:14px 16px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;
}
.drill-row .dtext{font-size:13.4px;color:var(--ink);}
.drill-btns{display:flex;gap:6px;}
.drill-btn{
  border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;
  font-size:12.5px;font-weight:700;letter-spacing:.02em;
}
.drill-btn.correct{background:var(--success-bg);border-color:var(--success);color:var(--success);}
.drill-btn.incorrect{background:var(--danger-bg);border-color:var(--danger);color:var(--danger);}
.drill-progress{
  font-family:'IBM Plex Mono';font-size:12px;color:var(--ink-soft);margin-bottom:14px;
}

/* calendar tool */
.cal-grid{display:grid;grid-template-columns:70px 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.cal-hour{border-top:1px solid var(--line);padding:6px 8px;font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono';}
.cal-track{position:relative;border-top:1px solid var(--line);min-height:34px;}
.cal-block{
  position:absolute;left:4px;right:4px;border-radius:6px;padding:4px 8px 4px 22px;font-size:11px;color:#fff;
  overflow:hidden;line-height:1.25;cursor:grab;transition:box-shadow .12s ease, transform .12s ease;
}
.cal-block:hover{box-shadow:0 3px 10px -2px rgba(0,0,0,.35);transform:translateY(-1px);}
.cal-block:active{cursor:grabbing;}
.cal-block b{display:block;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cal-block .cal-sub{font-size:9.5px;opacity:.9;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;}
.cal-block.conflict{outline:2px solid var(--danger);outline-offset:-2px;}
.cal-color-input{
  position:absolute;top:5px;left:5px;width:11px;height:11px;padding:0;border:1px solid rgba(255,255,255,.8);
  border-radius:50%;cursor:pointer;background:none;appearance:none;-webkit-appearance:none;
}
.cal-color-input::-webkit-color-swatch-wrapper{padding:0;border-radius:50%;}
.cal-color-input::-webkit-color-swatch{border:none;border-radius:50%;}

.week-grid{
  display:grid;grid-template-columns:56px repeat(5,1fr);gap:0;border:1px solid var(--line);
  border-radius:10px;overflow:hidden;background:#fff;
}
.week-gutter{display:flex;flex-direction:column;border-right:1px solid var(--line);}
.week-corner{height:30px;border-bottom:1px solid var(--line);}
.week-hour{font-size:10.5px;color:var(--ink-soft);font-family:'IBM Plex Mono';padding:2px 6px;border-top:1px solid var(--line);}
.week-hour:first-child{border-top:none;}
.week-col{display:flex;flex-direction:column;border-right:1px solid var(--line);}
.week-col:last-child{border-right:none;}
.week-day-header{
  height:30px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  color:var(--navy);background:#F6F7FB;border-bottom:1px solid var(--line);
}
.week-col-body{position:relative;background:repeating-linear-gradient(180deg,transparent,transparent 49px,var(--line) 50px);}

.decision-row{display:grid;grid-template-columns:1fr 200px;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);}
.decision-row:first-child{border-top:none;}
.decision-row .lbl{font-size:13px;color:var(--ink);}
.decision-row select{width:100%;padding:8px 9px;border-radius:7px;border:1px solid var(--line);font-size:12.5px;}

/* financial */
.field-row{display:grid;grid-template-columns:1fr 140px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);}
.field-row:last-child{border-bottom:none;}
.field-row label{font-size:13.4px;color:var(--ink);}
.field-row input{
  padding:8px 10px;border-radius:7px;border:1px solid var(--line);font-size:13.5px;text-align:right;
  font-family:'IBM Plex Mono';
}
.calc-total{
  display:flex;justify-content:space-between;align-items:center;padding:14px 4px 4px;margin-top:6px;
  border-top:2px solid var(--navy);font-family:'Fraunces';font-size:16px;color:var(--navy);
}

/* travel planner */
.leg-card{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;}
.leg-card .leg-title{font-weight:700;color:var(--navy);font-size:14px;margin-bottom:10px;}
.leg-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.leg-fields textarea, .leg-fields input{
  width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line);font-size:12.8px;font-family:inherit;resize:vertical;
}
.check-list{display:grid;gap:8px;margin-top:6px;}
.check-item{display:flex;gap:10px;align-items:flex-start;font-size:13.3px;}
.check-item input{margin-top:3px;accent-color:var(--orange);}

    {q:"Best first step to ensure an accurate meeting transcription?",
     opts:["Share the raw recording immediately with stakeholders","Verify the recording software is working before the meeting, and assign a backup note-taker","Edit the transcript for clarity without checking the recording","Skip transcription if the meeting seems informal"],
     a:1, r:"Catching a recording failure before it happens is far cheaper than fixing it after."},
    {q:"A stakeholder says the meeting minutes were unclear. Best course of action?",
     opts:["Stop distributing minutes to avoid future complaints","Blame the executive for speaking unclearly","Apologize, revise the minutes for clarity, and standardize a template for next time","Ignore the complaint — most people understand the gist"],
     a:2, r:"Fix the immediate issue and the process, so it doesn't repeat."},
    {q:"A client updates their contact info, but teammates keep using the old details. What ensures accuracy?",
     opts:["Wait for someone else to update the list","Only update the contact info you personally use","Update the master list and notify the whole team","Delete the old info without telling anyone"],
     a:2, r:"One source of truth, actively communicated, is what keeps a shared list reliable."}
  ]
},
{
  id:4,
  title:"Data, Email & Outreach",
  theme:"Administrative Data · Email Triage System · Cold Calling",
  objective:"Clean data before it becomes a report, run email as a control system rather than cleanup, and open cold outreach the right way.",
  lessons:[
    {h:"Data Entry That Holds Up", b:[
      "Use validation rules and filters, and cross-check against source documents — don't just submit raw data and let someone else fix it.",
      "Order of operations for cleanup: remove duplicates, correct inconsistent formatting, apply filters, then sort by relevant columns."
    ]},
    {h:"Email Is a Control System, Not Cleanup", b:[
      "Three access models — know which one you're in before acting independently:",
      "Full Access: read, respond, archive, and send on the executive's behalf.",
      "Draft & Review: draft responses and flag priorities; the executive approves before sending.",
      "Triage Only: sort, prioritize, and escalate — the executive responds themselves."
    ]},
    {h:"The Priority Matrix", b:[
      "Tier 1 — Immediate Escalation: legal deadlines, high-value clients, media inquiries, financial approvals, crisis comms. Notify the executive immediately.",
      "Tier 2 — Strategic: revenue opportunities, partnerships, board communications, vendor negotiations. Draft a response within 2–4 hours."
    ]},
    {h:"Calendar & Email Are One System", b:[
      "Convert scheduling emails into calendar holds immediately, confirm time zones, and attach relevant documents and the agenda to the invite.",
      "Track cancellations and reschedules as they happen — a stale calendar is a liability."
    ]},
    {h:"The Daily Routine", b:[
      "Morning scan (15–30 min): flag Tier 1 issues, clear spam, prepare a briefing summary.",
      "Midday review: draft responses, follow up on pending threads, confirm meetings.",
      "End-of-day review: confirm nothing urgent is left, prep tomorrow's summary.",
      "A short executive briefing beats forwarding dozens of raw emails — it reads as strategic, not reactive."
    ],
    example:{label:"Executive briefing, real format", lines:[
      "2 client escalation issues — responses drafted",
      "Vendor contract awaiting approval (expires Friday)",
      "Media request from Business Today — deadline tomorrow",
      "3 meeting confirmations secured",
      "Finance flagged payment discrepancy ($8,450)"
    ]}},

    {h:"What High-Performing Email Management Looks Like", b:[
      "Inbox at or near zero by end of day.",
      "80–90% of operational emails handled independently, with no missed critical deadlines and no confidentiality breaches.",
      "Executive time increasingly freed up for strategic work rather than inbox management."
    ],
    callout:{type:"stat", label:"Benchmark", text:"High-performing EAs handle 80–90% of operational emails independently — without escalating routine items that don't need executive time."}},

    {h:"Cold Calling, Appointment Setting & Lead Generation", b:[
      "Research before calling — company site, LinkedIn, recent news.",
      "Open with a brief, relevant value proposition, not a pitch: introduce yourself and ask for a short meeting on a specific topic.",
      "If a prospect is hesitant but not refusing, acknowledge that and offer a low-commitment next step."
    ]}
  ],
  quickChecks:[
    {afterIndex:2, q:"A media inquiry with a deadline tomorrow just landed. Under the Priority Matrix, this is:",
     opts:["Tier 2 — draft a response in 2–4 hours","Tier 1 — notify the executive immediately","Not worth flagging","Something to batch with the newsletter"],
     a:1, r:"Media inquiries with a hard deadline sit squarely in Tier 1 — immediate escalation."},
    {afterIndex:5, q:"What best distinguishes high-performing email management from average?",
     opts:["Forwarding every email so nothing is missed","Handling 80–90% of operational emails independently with zero missed deadlines","Replying to everything within 5 minutes","Deleting anything that looks unimportant"],
     a:1, r:"It's about independent, reliable handling of the bulk of email — not speed or forwarding volume."}
  ],
  quiz:[
    {q:"Under the 'Draft & Review' email access model, you...",
     opts:["Send on the executive's behalf without review","Draft responses and flag priorities, but the executive approves before sending","Only sort emails — never draft anything","Have full inbox authority including archiving and calendar invites"],
     a:1, r:"Draft & Review keeps the executive as the final approver on outgoing messages."},
    {q:"A Tier 1 email arrives (media inquiry with a deadline tomorrow). What's the required action?",
     opts:["Batch it with other emails for the end-of-day review","Notify the executive immediately","Draft a response within 2–4 hours","Delete it as low priority"],
     a:1, r:"Tier 1 items — legal, high-value client, media, financial approval, crisis — require immediate notification."},
    {q:"Best opening line for a cold call?",
     opts:["\"Hi, I'm calling to sell you our services.\"","\"Hi, I'm [Name] from [Company]. I wanted to see if we could schedule a brief meeting to discuss [relevant topic].\"","\"Are you available right now for a 30-minute presentation?\"","\"I'll just send you an email instead.\""],
     a:1, r:"It's specific, low-pressure, and value-oriented rather than a hard pitch."},
    {q:"You receive a 500-row spreadsheet with typos and incomplete entries. Best first step?",
     opts:["Submit it as-is and let the manager fix errors","Use validation rules/filters and cross-check against source documents","Delete any row that looks incomplete","Sort it alphabetically and call it done"],
     a:1, r:"Verifying against source data before reporting is what prevents downstream errors."},
    {q:"The purpose of a morning email briefing is to...",
     opts:["Replace dozens of forwarded emails with a short, prioritized summary","Give the executive every email in full detail","Avoid having to check email until midday","Just confirm the inbox is empty"],
     a:0, r:"A tight briefing positions the assistant as strategic, not just a message-forwarder."}
  ]
},
{
  id:5,
  title:"Household, Risk & Lifestyle Support",
  theme:"Household Operations · Personal Insurance & Risk Framework · Lifestyle Coordination",
  objective:"Run household operations like a small business, apply a real risk-management framework, and keep lifestyle support organized and trackable.",
  lessons:[
    {h:"Running a Household Like a Business", b:[
      "Home management means applying real planning, organizing, budgeting, and evaluation to household operations.",
      "The assistant is the main point of contact for family, household staff, and contractors — overseeing maintenance, repairs, and seasonal projects."
    ]},
    {h:"When a Vendor Falls Through", b:[
      "Notify the household immediately and propose alternatives — don't quietly reschedule and hope it works out.",
      "Keep backup vendors ready in advance so a last-minute cancellation doesn't become a crisis."
    ]},
    {h:"The PA Risk Management Framework", b:[
      "PAs operate across four risk categories, each with a distinct role:",
      "Financial Risk (unpaid premiums, lapsed policies, fraud) — monitor renewals, verify payments, keep documentation accurate.",
      "Legal & Liability Risk (personal injury claims, contractual exposure, household-staff liability) — flag exposure early.",
      "Operational Risk (missed deadlines, travel disruption, vendor failure) — build contingency plans, keep organized systems.",
      "Reputational Risk (social media exposure, public disputes, data breaches) — practice discretion, secure communications."
    ]},
    {h:"The Four Core Risk Strategies", b:[
      "Applying the right strategy to the right risk is the actual skill — not just naming the risk."
    ],
    table:{headers:["Strategy","What it means","Example"], rows:[
      ["Avoidance","Avoid the activity that creates the risk","Not investing in extremely volatile assets without expertise"],
      ["Reduction","Add safety measures to lower potential loss","Smoke detectors, security systems, defensive driving courses"],
      ["Transfer","Shift the financial risk to an insurer","Purchasing homeowners or auto insurance"],
      ["Retention","Accept minor risk when insuring costs more than the risk itself","Paying for small car repairs out of pocket"]
    ]}},

    {h:"Insurance & Risk at a Glance", b:[
      "Track policy expiration dates and compare coverage against what's actually recommended (e.g. liability coverage relative to net worth).",
      "Summarize gaps and get advisor input rather than changing coverage unilaterally.",
      "Insurance claims often involve sensitive data (medical records, financial details) — use encrypted storage, limit access, and confirm secure portals before uploading anything."
    ],
    callout:{type:"tip", label:"Semi-annual risk check", text:"Review twice a year: has net worth increased? New properties or vehicles? More international travel? Any new household staff? Each 'yes' is a potential coverage update."}},

    {h:"Travel Risk Management", b:[
      "Before travel: confirm travel insurance and international medical coverage, register with an embassy if high-profile, share the itinerary securely.",
      "During travel: keep an emergency contact sheet, digital copies of documents, and use secure Wi-Fi practices.",
      "After travel: reconcile expenses and file any claims promptly."
    ]},
    {h:"Lifestyle & Personal Support", b:[
      "Track errands, gifts, and events in one shared digital tool with clear deadlines, budgets, and owners.",
      "Ad hoc handling without tracking is exactly where things get dropped."
    ]}
  ],
  quickChecks:[
    {afterIndex:3, q:"A family purchases homeowners insurance to cover potential losses from fire or theft. Which risk strategy is this?",
     opts:["Avoidance","Reduction","Transfer","Retention"],
     a:2, r:"Buying insurance shifts the financial risk onto the insurer — that's Transfer."},
    {afterIndex:4, q:"During the semi-annual risk review, which of these is a genuine trigger to revisit coverage?",
     opts:["The weather changed","Net worth increased significantly since the last review","The assistant took a vacation","A vendor changed their logo"],
     a:1, r:"A meaningful change in net worth, property, vehicles, or household staff should always prompt a coverage check."}
  ],
  quiz:[
    {q:"A household vendor cancels last-minute. Correct move?",
     opts:["Reschedule quietly with the same vendor and say nothing","Notify the household immediately and line up a backup vendor","Ignore it and hope it resolves itself","Cancel the service entirely"],
     a:1, r:"Immediate transparency plus a backup plan prevents the gap from becoming a bigger problem."},
    {q:"You notice liability insurance is well below what's recommended for the family's net worth. Best step?",
     opts:["Increase coverage immediately without asking anyone","Summarize current coverage, flag the gap, and consult an insurance advisor","Ignore it as long as premiums are being paid","Cancel the policy and start over"],
     a:1, r:"Surface the gap with a clear summary and expert input — don't act unilaterally on someone else's coverage."},
    {q:"Before a family member's adventure vacation, you should...",
     opts:["Assume standard travel insurance covers everything","Verify travel insurance actually covers the specific activities planned","Tell them not to go","Skip the emergency contact sheet to save time"],
     a:1, r:"Generic travel insurance often excludes higher-risk activities — always verify against the actual plan."},
    {q:"Best way to manage recurring personal errands like gifts, events, and wardrobe tasks?",
     opts:["Handle everything ad hoc as it comes up","A shared digital tracker with deadlines, budgets, and clear ownership","Keep it entirely in your head for speed","Delegate everything without follow-up"],
     a:1, r:"Tracking is what prevents small recurring tasks from silently slipping."},
    {q:"Home management is best understood as...",
     opts:["A purely reactive, task-by-task job","Running the household with the same planning and budgeting discipline as a business","Something that doesn't require organizational skill","Primarily about socializing with vendors"],
     a:1, r:"It draws directly on planning, organizing, budgeting, and evaluating — the same skills that run a business."}
  ]
},
{
  id:6,
  title:"Business Setup, Compliance & Project Leadership",
  theme:"Entity Formation · Regulatory Compliance · Project Leadership · KPI Dashboards",
  objective:"Guide business formation and compliance decisions, lead projects when timelines slip, and optimize operations with a real KPI dashboard.",
  lessons:[
    {h:"Choosing a Business Structure", b:[

      "Gather the client's goals, states of operation, and expansion plans before recommending a structure."
    ]},
    {h:"Staying in Good Standing", b:[
      "Regulatory compliance is maintained through ongoing filings and license renewals — not a one-time step at formation.",
      "If a required license has lapsed mid-operation, notify the owner immediately and help initiate renewal or corrective action."
    ]},
    {h:"Leading a Project Under Pressure", b:[
      "When deadlines slip, find the root cause of the delay before reassigning tasks — public blame fixes nothing.",

    ]},
    {h:"Frameworks Worth Knowing", b:[

    {h:"Operational Optimization", b:[

    {afterIndex:5, q:"On the KPI dashboard, which category does 'Filing Deadline Adherence (100%)' belong to?",

  quiz:[
    {q:"Before recommending a business structure to a client, you should first...",

     a:1, r:"Structure recommendations depend entirely on the specifics of the business's goals and footprint."},
    {q:"You discover an operating license expired and the business is still running. Best action?",
     opts:["Ignore it since operations haven't stopped","Notify the owner immediately and help initiate renewal or corrective action","Wait until the next audit to mention it","Shut the business down yourself"],

    {q:"A project is behind schedule due to missed deadlines from several team members. Best first response?",
     opts:["Publicly call out who missed their deadlines","Identify the root cause of the delays before reassigning anything","Ignore it and hope the team catches up","Cancel the project"],
     a:1, r:"You can't fix a delay effectively until you know why it happened."},
    {q:"A client wants frequent updates and is anxious about a project's progress. Best approach?",
     opts:["Go quiet until the project is finished","Provide structured progress reports on a set, predictable cadence","Share unverified information just to say something","Tell the client to stop asking"],
     a:1, r:"Predictable, structured updates build confidence even when there isn't dramatic news to share."},
    {q:"The most effective way to measure team productivity is to...",
     opts:["Track every metric available, regardless of relevance","Define a small set of specific KPIs and track them consistently","Rely on gut feeling","Only measure output at year-end"],
     a:1, r:"Focused, well-defined KPIs reviewed regularly give an accurate operational picture."}
  ]
},
{
  id:7,
  title:"Financial Operations Support",
  theme:"SOA Reconciliation · Billing & Invoicing · SOPs · Financial KPIs",
  objective:"Support financial operations accurately — reconciling accounts, posting expenses, preparing invoices, and staying audit-ready.",
  lessons:[
    {h:"The EA/PA's Role in Finance", b:[
      "Responsibilities now regularly include transaction support (invoices, expenses, reimbursements) and financial coordination between accounting, HR, and operations.",
      "This is a real link in accurate financial data flow, not just administrative filing."
    ]},
    {h:"SOA Reconciliation", b:[
      "Closing balance = Opening balance + new invoices − payments received +/− adjustments.",
      "If revenue records don't match bank deposits, the first step is comparing bank statements against revenue records — not recreating every report from scratch."
    ]},
    {h:"What an SOP Actually Needs", b:[
      "An SOP is a documented, step-by-step process designed for consistency, compliance, and accountability.",
      "Five core elements every SOP needs: Purpose (why it exists), Scope (who it applies to), Procedure (step-by-step actions), Controls (verification measures), and Escalation (when to report issues).",
      "Without SOPs, execution is inconsistent — and inconsistency is what audits catch."
    ]},
    {h:"The Financial Calendar", b:[
      "Track three recurring categories: billing cycles (monthly, bi-weekly, retainer-based), tax deadlines (federal filing, quarterly estimates, vendor 1099s), and monthly closes (bank reconciliation, AR/AP reconciliation, report generation).",
      "Best practice: maintain a shared financial calendar with reminders 7–10 days prior to each deadline."
    ]},
    {h:"Billing & Invoicing", b:[
      "Total before discount = (hourly rate × hours worked) + expenses; then the discount is applied to reach the final invoice amount.",
      "Every invoice needs to clearly state the amount due, the due date, and the payment terms."
    ]},
    {h:"Contract-Aware Billing", b:[
      "Know the payment terms, late fees, billing cycle, and any billable-hour caps before billing begins.",
      "Approaching a contracted hour cap should be flagged proactively — going over it without warning creates real financial and relationship risk."
    ]},
    {h:"Financial KPIs for EAs/PAs", b:[
      "Invoice Turnaround Time — time from service completion to invoice sent. Target: 24–72 hours.",
      "Reconciliation Accuracy Rate — % of reconciliations completed without correction. Target: 98–100%.",
      "Additional metrics worth tracking: Days Sales Outstanding (DSO) and expense-approval cycle time."
    ],
    callout:{type:"stat", label:"Set the alert early", text:"A common best practice is to set an alert when a client retainer drops below 25% — it gives enough runway to act before the account runs dry."}},

    {h:"Bookkeeping Basics & Compliance", b:[
      "Classify every transaction as income, expense, or receivable — accurate, consistent bookkeeping is what makes audits and decisions trustworthy.",
      "Maintain clear audit trails and segregate duties — never approve your own transactions. Incomplete records and self-approval are the two biggest audit red flags."
    ]}
  ],
  quickChecks:[
    {afterIndex:2, q:"Which SOP element answers \"who does this process apply to?\"",
     opts:["Purpose","Scope","Controls","Escalation"],
     a:1, r:"Scope defines who the procedure covers; Purpose explains why it exists."},
    {afterIndex:6, q:"What's the target range for Invoice Turnaround Time?",
     opts:["1–2 hours","24–72 hours","1–2 weeks","No target — whenever it gets done"],
     a:1, r:"24–72 hours from service completion to invoice sent is the benchmark target."}
  ],
  quiz:[
    {q:"What's the formula for a Statement of Account (SOA) closing balance?",
     opts:["Opening balance + new invoices − payments received +/− adjustments","Opening balance − new invoices","Only the sum of unpaid invoices","Total revenue minus total expenses"],
     a:0, r:"Every movement — new charges, payments, and adjustments — has to be accounted for against the opening balance."},
    {q:"Reported revenue doesn't match actual bank deposits. What's the first investigative step?",
     opts:["Recreate every financial report from scratch","Compare bank statements against revenue records","Ask management to explain it without checking anything yourself","Ignore small discrepancies"],
     a:1, r:"A direct comparison is the fastest way to isolate where the mismatch is coming from."},
    {q:"Every invoice must clearly include:",
     opts:["A discount, regardless of whether one applies","The amount due, due date, and payment terms","Only the client's name and total","A handwritten signature"],
     a:1, r:"These three elements are the minimum for a professional, disputable-if-needed invoice."},
    {q:"A contract caps billable hours at 100/month and the team is approaching that cap. Best move?",
     opts:["Say nothing and let hours go over the cap","Flag it to the executive/client before hours exceed the contracted cap","Stop working immediately at hour 90","Change the contract terms unilaterally"],
     a:1, r:"Proactively flagging protects both the relationship and the billing accuracy."},
    {q:"The biggest compliance red flag in day-to-day bookkeeping is:",
     opts:["Using accounting software","Approving your own transactions (no segregation of duties)","Filing receipts digitally","Reviewing the books weekly"],
     a:1, r:"Segregation of duties exists specifically to prevent self-approved, unchecked transactions."}
  ]
},
{
  id:8,
  title:"Access, Confidentiality & Crisis Management",
  theme:"Credential Management · Least-Privilege Access · Incident Response",
  objective:"Manage account access responsibly, respond correctly to a suspected data risk, and fix workflows before they cause a leak.",
  lessons:[
    {h:"Credential Management", b:[
      "Every user gets a role matched to what they actually need to do, with MFA enabled.",
      "Keep a documented credential log noting role, MFA status, and when it was last updated. Never share passwords."
    ],
    table:{headers:["Role","Typical access","Use when"], rows:[
      ["Admin","Full read/write, settings, user management","Someone directly responsible for the account/system"],
      ["Editor","Read/write on content, no settings access","Someone who creates or updates work regularly"],
      ["Viewer","Read-only","Someone who only needs visibility, not to make changes"]
    ]}},

    {h:"Least-Privilege Access", b:[
      "Over-permissioning — like giving a junior staff member admin access — is how systems get accidentally broken.",
      "Always assign the minimum role that lets someone actually do their job."
    ],
    callout:{type:"warning", label:"Real scenario", text:"A junior staffer mistakenly given admin access modified system settings they never should have been able to touch. The fix isn't blame — it's correcting the role assignment and reviewing who else may be over-permissioned."}},

    {h:"Responding to a Suspicious Data Request", b:[
      "Verify the sender's identity before doing anything else.",
      "Escalate internally through the correct channel, then close the gap that let the request reach you in the first place."
    ]},
    {h:"Containing a Confidentiality Leak", b:[
      "Contain the leak immediately — that comes before anything else.",
      "Notify the right roles (not just names), and put a policy in place so it doesn't repeat."
    ]},
    {h:"Fixing a Broken Workflow", b:[
      "Disconnected tools — email plus a spreadsheet plus notes — cause duplicate work and missed updates.",
      "Consolidate into one tracked system, and call out clearly which steps are still manual so they can be improved next."
    ]}
  ],
  quickChecks:[
    {afterIndex:0, q:"Someone only needs to check on project status without making changes. Which role fits?",
     opts:["Admin","Editor","Viewer","No access at all"],
     a:2, r:"Viewer gives visibility without the ability to alter anything — least privilege for a status-check need."},
    {afterIndex:3, q:"Confidential documents were sent to the wrong recipient. What comes first?",
     opts:["Drafting a new policy for next quarter","Containing the leak immediately","Waiting to see if anyone notices","Blaming whoever sent it"],
     a:1, r:"Containment always comes before policy work — stop the damage, then fix the process."}
  ],
  quiz:[
    {q:"A junior staff member was mistakenly given admin access and changed system settings. This is a failure of:",
     opts:["Password strength","Least-privilege / role-based access assignment","Internet connectivity","File naming conventions"],
     a:1, r:"Roles should match what someone actually needs — nothing more."},
    {q:"An unknown sender urgently requests sensitive client data by email. Your first step?",
     opts:["Send the data quickly since it's marked urgent","Verify the sender's identity before responding at all","Forward it to a colleague for a second opinion","Delete the email without telling anyone"],
     a:1, r:"Verification always comes before any action on a sensitive request."},
    {q:"Confidential documents were accidentally sent to the wrong recipient. First priority?",
     opts:["Draft a policy update for next quarter","Contain the leak immediately","Wait to see if anyone notices","Blame whoever sent it"],
     a:1, r:"Containment first, process fix second — in that order."},
    {q:"A credential log should always include:",
     opts:["Just the username","Assigned role, MFA status, and last-updated date","The user's personal email password","Nothing — logs aren't necessary"],
     a:1, r:"These three fields are what make a credential log actually useful for an audit or incident review."},
    {q:"The root problem with using email, a spreadsheet, and notes separately for one workflow is:",
     opts:["It looks unprofessional","Duplicate work and missed updates from having no single source of truth","It costs more money","Nothing — it works fine long-term"],
     a:1, r:"Fragmented tracking is exactly where updates get lost and effort gets duplicated."}
  ]
},
{

/* ---------- storage (persists across sessions) ---------- */
const mem = {}; // in-memory fallback if window.storage is unavailable
async function storeGet(key){
  try{
    if(window.storage){
      const r = await window.storage.get(key,false);
      return r ? JSON.parse(r.value) : null;
    }
  }catch(e){ /* key not found or storage error */ }
  return mem[key] !== undefined ? mem[key] : null;
}
async function storeSet(key,val){
  mem[key]=val;
  try{
    if(window.storage){ await window.storage.set(key, JSON.stringify(val), false); }
    return true;
  }catch(e){
    console.warn("storage set failed",e);
    toast("Couldn't save — your device may be low on storage. Your work is kept for this session.");
    return false;
  }
}

async function loadAll(){
  const p = await storeGet("day-progress");
  state.progress = p || {};
  const n = await storeGet("trainee-name");
  state.traineeName = n || "";
  const pr = await storeGet("practice-progress");
  state.practiceProgress = pr || {};
  const nt = await storeGet("notes");
  state.notes = nt || [];
  state.storageReady = true;
}

/* ---------- helpers ---------- */
function esc(s){ return (s+"").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return ""; const d=new Date(iso); return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.classList.remove("show"),2600);
}
function burstConfetti(){
  const colors=["#DB8437","#262B45","#3F7D58","#B5651F","#F0C08A"];
  for(let i=0;i<26;i++){
    const el=document.createElement("div");
    el.className="confetti-piece";
    el.style.left=(38+Math.random()*24)+"vw";
    el.style.top=(18+Math.random()*8)+"vh";
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDelay=(Math.random()*0.25)+"s";
    el.style.transform=`rotate(${Math.random()*360}deg)`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1700);
  }
}
window.burstConfetti = burstConfetti;
function dayUnlocked(id){
  return true; // locking disabled for now — all days open
}
function completedCount(){
  return Object.values(state.progress).filter(p=>p&&p.done).length;
}

/* ---------- seal / brand mark (signature visual element) ---------- */
function sealSvg({size=120, label="", sub="", fill="var(--orange)", ink="#241304", scale=1, done=true, pulse=false}={}){
  const points = 14, r1=48, r2=41, cx=50, cy=50;
  let path="";
  for(let i=0;i<points*2;i++){
    const ang = (Math.PI*2*i)/(points*2) - Math.PI/2;
    const r = i%2===0 ? r1 : r2;
    const x = cx + r*Math.cos(ang), y = cy + r*Math.sin(ang);
    path += (i===0?"M":"L") + x.toFixed(2) + "," + y.toFixed(2) + " ";
  }
  path += "Z";
  const opacity = done ? 1 : 0.35;
  return `<svg class="seal${pulse?' pulse':''}" width="${size}" height="${size}" viewBox="0 0 100 100" style="opacity:${opacity}">
    <path d="${path}" fill="${fill}" stroke="var(--navy)" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="33" fill="none" stroke="${ink}" stroke-width="1" opacity=".5"/>
    <text x="50" y="${sub?46:53}" text-anchor="middle" font-family="Fraunces" font-weight="700" font-size="${label.length>2?15:22}" fill="${ink}">${esc(label)}</text>
    ${sub?`<text x="50" y="60" text-anchor="middle" font-family="IBM Plex Mono" font-size="6.5" letter-spacing="1" fill="${ink}" opacity=".85">${esc(sub)}</text>`:""}
  </svg>`;
}
function brandMark(){
  return `<img class="brand-mark" src="${LOGO_ICON_DATAURI}" alt="LSH logo">`;
}

/* ---------- dashboard ---------- */
function renderDashboard(){
  const done = completedCount();
  const pct = Math.round((done/DAYS.length)*100);
  return `
  <div class="hero">
    <div>
      <p class="eyebrow">EA / PA Upskill Program</p>
      <h1>Ten days to become an indispensable force multiplier.</h1>
      <p>Condensed lessons, a knowledge check for every day, and a Practice Lab where you can actually run email triage, calendar rescues, financial reconciliation, travel contingency planning, and call handling before you do it for real.</p>
      <div class="hero-actions">
        <button class="btn btn-primary" onclick="goto('day',${nextDayId()})">${done===0?"Start Day 1":"Continue training"}</button>
        <button class="btn btn-ghost" onclick="goto('practice')">Open Practice Lab</button>
        <button class="btn btn-navy" onclick="downloadRecordPdf()">⬇ Download Training Record</button>
      </div>
    </div>
    <div class="hero-seal-wrap">
      <div style="display:flex;flex-direction:column;align-items:center;gap:18px;">
        <img src="${LOGO_FULL_DATAURI}" alt="Legal Support Help" style="width:150px;height:auto;">
        ${sealSvg({size:120,label:pct+"%",sub:"COMPLETE",done:pct>0,pulse:pct===100})}
      </div>
    </div>
  </div>

  <div class="stat-row">
    <div class="card stat"><div class="num">${done} / 10</div><div class="lbl">Days completed</div></div>
    <div class="card stat"><div class="num">${avgScore()}%</div><div class="lbl">Average quiz score</div></div>
    <div class="card stat"><div class="num">${practiceRunsCount()}</div><div class="lbl">Practice Lab runs</div></div>
    <div class="card stat"><div class="num">${pct}%</div><div class="lbl">Program complete</div></div>
  </div>

  <h2 class="section-title">Training Roadmap <span class="tag">10 DAYS</span></h2>
  <div class="timeline">
    ${DAYS.map(d=>dayRow(d)).join("")}
  </div>
  `;
}
function nextDayId(){
  for(const d of DAYS){ if(!(state.progress[d.id]&&state.progress[d.id].done)) return d.id; }
  return 10;
}
function avgScore(){
  const scores = Object.values(state.progress).filter(p=>p&&typeof p.score==="number").map(p=>p.score);
  if(!scores.length) return 0;
  return Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
}
function practiceRunsCount(){
  const pp = state.practiceProgress||{};
  return Object.values(pp).reduce((a,v)=>a+(v.runs||0),0);
}
function dayRow(d){
  const prog = state.progress[d.id];
  const unlocked = dayUnlocked(d.id);
  const status = prog&&prog.done ? "done" : (unlocked?"open":"locked");
  const pillClass = status==="done"?"pill-done":(status==="open"?"pill-open":"pill-locked");
  const pillLabel = status==="done"?"Completed":(status==="open"?"Available":"Locked");
  return `
  <div class="card day-row ${status}">
    <div class="day-num">${status==="locked"?"🔒":d.id}</div>
    <div class="day-body">
      <h3>Day ${d.id} — ${esc(d.title)}</h3>
      <p>${esc(d.theme)}</p>
    </div>
    <div class="day-meta">
      ${prog&&typeof prog.score==="number"?`<span class="score-tag">${prog.score}%</span>`:""}
      <span class="pill ${pillClass}">${pillLabel}</span>
      <button class="btn btn-sm ${status==='locked'?'btn-ghost':'btn-navy'}" ${status==='locked'?'disabled':''} onclick="goto('day',${d.id})">${status==='done'?'Review':'Open'}</button>
    </div>
  </div>`;
}

/* ---------- router ---------- */
function goto(view, id){
  state.view=view;
  if(view==="day"){ state.dayId=id; state.quizAnswers={}; state.quizSubmitted=false; }
  if(view==="tool"){ state.toolId=id; }
  window.scrollTo({top:0,behavior:"smooth"});
  render();
}
window.goto = goto;

async function promptName(){
  const overlay=document.createElement("div");
  overlay.className="overlay";
  overlay.innerHTML=`
    <div class="card">
      <h3>Your name</h3>
      <p>Used on your Training Record PDF and to save your local progress.</p>
      <input id="nameInput" type="text" placeholder="e.g. Jamie Santos" value="${esc(state.traineeName)}">
      <div class="row">
        <button class="btn btn-ghost" id="cancelName">Cancel</button>
        <button class="btn btn-primary" id="saveName">Save</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById("nameInput").focus();
  document.getElementById("cancelName").onclick=()=>overlay.remove();
  document.getElementById("saveName").onclick=async ()=>{
    const v=document.getElementById("nameInput").value.trim();
    state.traineeName=v;
    await storeSet("trainee-name", v);
    overlay.remove();
    render();
    toast("Saved");
  };
  overlay.addEventListener("click",(e)=>{ if(e.target===overlay) overlay.remove(); });
}
window.promptName = promptName;

/* ---------- main render dispatcher ---------- */
function render(){
  const app=document.getElementById("app");
  let body="";
  if(state.view==="dashboard") body=renderDashboard();
  else if(state.view==="day") body=renderDay(state.dayId);
  else if(state.view==="practice") body=renderPracticeHub();
  else if(state.view==="tool") body=renderTool(state.toolId);
  else if(state.view==="handouts") body=renderHandouts();
  else if(state.view==="notes") body=renderNotes();
  app.innerHTML = renderTopbar() + `<main>${body}</main>` + renderFooter();
  afterRender();
}
function renderFooter(){
  return `<div class="footer-note">LSH EA / PA Upskill Program &middot; Internal Training Portal &middot; Progress saved automatically to this device</div>`;
}
function afterRender(){
  if(state.view==="tool") initTool(state.toolId);
}

  render();

async function submitQuiz(dayId){
  const d = DAYS.find(x=>x.id===dayId);
  const total = d.quiz.length;
  const answered = Object.keys(state.quizAnswers).length;
  if(answered<total){ toast(`Answer all ${total} questions first (${answered}/${total} done).`); return; }
  let correct=0;
  d.quiz.forEach((q,i)=>{ if(state.quizAnswers[i]===q.a) correct++; });
  const score = Math.round((correct/total)*100);
  const passed = score>=70;
  state.quizSubmitted=true;
  state.lastScore=score; state.lastCorrect=correct; state.lastTotal=total; state.lastPassed=passed;

  const prevBest = state.progress[dayId]?.score || 0;
  const newRecord = {done: passed || (state.progress[dayId]?.done||false), score: Math.max(score, prevBest), date: new Date().toISOString()};
  state.progress[dayId]=newRecord;
  await storeSet("day-progress", state.progress);

  document.getElementById("quizWrap").innerHTML = renderQuiz(d);
  document.getElementById("quizWrap").scrollIntoView({behavior:"smooth",block:"start"});
  renderAnswerFeedback(d);
  if(passed) burstConfetti();
}
window.submitQuiz = submitQuiz;

  const {lastScore, lastCorrect, lastTotal, lastPassed} = state;
  const passMsgs = ["Nice work — next day unlocked.", "Sharp — you've got this down.", "Solid pass. On to the next one.", "That's a wrap on Day "+d.id+" — well done."];
  const failMsgs = ["Not quite 70% yet — review below and try again.", "Close, but not there yet — a quick review below should help.", "So close! Look over the answers below and give it another go."];
  const msg = lastPassed ? passMsgs[Math.floor(Math.random()*passMsgs.length)] : failMsgs[Math.floor(Math.random()*failMsgs.length)];
  return `
    <div class="card quiz-result">
      ${sealSvg({size:84,label:lastScore+"%",done:lastPassed})}
      <div class="big" style="margin-top:10px;">${lastCorrect} / ${lastTotal} correct</div>
      <div class="sub">${msg}</div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;">
        <button class="btn btn-ghost" onclick="retakeQuiz(${d.id})">Retake Quiz</button>
        ${lastPassed && d.id<10 ? `<button class="btn btn-primary" onclick="goto('day',${d.id+1})">Continue to Day ${d.id+1} &rarr;</button>`:""}

      </div>
    </div>
    <div id="answerFeedback"></div>
  `;
}

/* ============================================================
   2. LEGAL CALENDAR CONFLICT RESOLVER (week view, draggable, colorable)
   ============================================================ */
const CAL_DAY_START = 8.5, CAL_DAY_END = 17.5, CAL_PX_PER_HR = 46;

function calMergedEvents(){
  return CAL_EVENTS.map((e,i)=>{
    const ov = toolState.calEdits[i];
    return ov ? Object.assign({}, e, ov) : Object.assign({}, e);
  });
}
function calFindConflicts(events){
  const conflicts=[];
  for(let i=0;i<events.length;i++){
    for(let j=i+1;j<events.length;j++){
      const a=events[i], b=events[j];
      if(a.day===b.day && a.s<b.e && b.s<a.e) conflicts.push([i,j]);
    }
  }
  return conflicts;
}

async function initCalendar(body){
  toolState.calEdits = (await storeGet("calendar-edits")) || {};
  toolState.calBaseline = calFindConflicts(CAL_EVENTS).length; // conflicts before any edits, fixed for this session
  renderCalendarBody(body);
}

function renderCalendarBody(body){
  const events = calMergedEvents();
  const conflicts = calFindConflicts(events);
  const conflictIdx = new Set(conflicts.flat());
  const hours=[]; for(let h=Math.ceil(CAL_DAY_START);h<=Math.floor(CAL_DAY_END);h++) hours.push(h);
  const colH = (CAL_DAY_END-CAL_DAY_START)*CAL_PX_PER_HR;

  function colFor(day){
    const dayEvents = events.map((e,i)=>({...e, idx:i})).filter(e=>e.day===day);
    return dayEvents.map(e=>{
      const top = (e.s-CAL_DAY_START)*CAL_PX_PER_HR;
      const h = Math.max((e.e-e.s)*CAL_PX_PER_HR, 30);
      const isConflict = conflictIdx.has(e.idx);
      const bg = e.color || PRI_COLOR[e.p];
      return `<div class="cal-block ${isConflict?'conflict':''}" draggable="true"
                ondragstart="calDragStart(event,${e.idx})"
                style="top:${top}px;height:${h}px;background:${bg};" title="Drag to move · click the dot to recolor">
        <input type="color" class="cal-color-input" value="${toHex(bg)}" onclick="event.stopPropagation()" onchange="calColorChange(${e.idx}, this.value)">
        <b>${esc(e.t)}</b><span class="cal-sub">${e.loc!=="—"?esc(e.loc)+" · ":""}${esc(e.type)}</span>
      </div>`;
    }).join("");
  }

  body.innerHTML = `
    <p style="font-size:13px;color:var(--ink-soft);margin-bottom:10px;">This attorney's <b>week</b> has <b>${toolState.calBaseline} overlapping commitments</b> (outlined in red). <b>Drag any block</b> to a new day or time to resolve a conflict, and click the small dot on a block to recolor it. Nothing here is graded until you click Check My Plan.</p>
    <div class="legend-row">
      ${["High","Medium","Low"].map(p=>`<span class="legend-chip"><span class="sw" style="background:${PRI_COLOR[p]};"></span>${p} priority</span>`).join("")}
      <button class="btn btn-ghost btn-sm" style="margin-left:auto;" onclick="calReset()">Reset to Original</button>
    </div>
    <div class="week-grid">
      <div class="week-gutter" style="height:${colH+30}px;">
        <div class="week-corner"></div>
        ${hours.map(h=>`<div class="week-hour" style="height:${CAL_PX_PER_HR}px;">${h>12?h-12:h}${h>=12?'PM':'AM'}</div>`).join("")}
      </div>
      ${DAY_ORDER.map(day=>`
        <div class="week-col" ondragover="event.preventDefault()" ondrop="calDrop(event,'${day}')">
          <div class="week-day-header">${day}</div>
          <div class="week-col-body" style="height:${colH}px;">${colFor(day)}</div>
        </div>`).join("")}
    </div>
    <h3 style="margin:22px 0 4px;color:var(--navy);font-size:15px;">Remaining Conflicts</h3>
    <div class="card" style="padding:14px 20px;">
      ${conflicts.length===0
        ? `<p style="font-size:13px;color:var(--success);margin:6px 0;">✅ No overlapping commitments remain.</p>`
        : conflicts.map(([i,j])=>`
          <div class="decision-row" style="grid-template-columns:1fr;">
            <div class="lbl"><b>${esc(events[i].t)}</b> (${events[i].p}, ${events[i].day}) overlaps <b>${esc(events[j].t)}</b> (${events[j].p}, ${events[j].day})</div>
          </div>`).join("")}
    </div>
    <button class="btn btn-primary" style="margin-top:16px;" onclick="submitCalendar()">Check My Plan</button>
    <div id="calResult"></div>
  `;
}
function toHex(c){
  if(c.startsWith("#")) return c;
  return "#DB8437";
}
function calDragStart(ev, idx){
  ev.dataTransfer.setData("text/plain", String(idx));
}
window.calDragStart = calDragStart;
async function calDrop(ev, day){
  ev.preventDefault();
  const idx = Number(ev.dataTransfer.getData("text/plain"));
  const colBody = ev.currentTarget.querySelector(".week-col-body");
  const rect = colBody.getBoundingClientRect();
  const y = ev.clientY - rect.top;
  let newStart = CAL_DAY_START + y/CAL_PX_PER_HR;
  newStart = Math.round(newStart*2)/2; // snap to nearest 30 min
  const base = CAL_EVENTS[idx];
  const dur = base.e - base.s;
  newStart = Math.max(CAL_DAY_START, Math.min(newStart, CAL_DAY_END-dur));
  const existing = toolState.calEdits[idx] || {};
  toolState.calEdits[idx] = {...existing, day, s:newStart, e:newStart+dur};
  await storeSet("calendar-edits", toolState.calEdits);
  renderCalendarBody(document.getElementById("toolBody"));
}
window.calDrop = calDrop;
async function calColorChange(idx, hex){
  const existing = toolState.calEdits[idx] || {};
  toolState.calEdits[idx] = {...existing, color:hex};
  await storeSet("calendar-edits", toolState.calEdits);
  renderCalendarBody(document.getElementById("toolBody"));
}
window.calColorChange = calColorChange;
async function calReset(){
  toolState.calEdits = {};
  await storeSet("calendar-edits", {});
  renderCalendarBody(document.getElementById("toolBody"));
  toast("Calendar reset to original");
}
window.calReset = calReset;

async function submitCalendar(){
  const events = calMergedEvents();
  const remaining = calFindConflicts(events).length;
  const baseline = toolState.calBaseline || 1;
  const resolved = Math.max(0, baseline - remaining);
  const score = baseline===0 ? 100 : Math.round((resolved/baseline)*100);
  document.getElementById("calResult").innerHTML=`
    <div class="card" style="padding:18px 20px;margin-top:16px;">
      <b style="color:var(--navy);">${resolved} / ${baseline} conflicts resolved (${score}%)</b>
      <p style="font-size:12.8px;color:var(--ink-soft);margin:8px 0 0;">Best practice when reshuffling: move the lower-priority commitment, and keep High-priority items — depositions, hearings, client emergencies — right where they are.</p>
    </div>`;
  await bumpPracticeProgress("calendar", score);
  const lines = [
    "LEGAL CALENDAR CONFLICT RESOLVER — Activity Report",
    `Conflicts resolved: ${resolved} / ${baseline} (${score}%)`, "---",
    "Final weekly schedule:"
  ];
  DAY_ORDER.forEach(day=>{
    const dayEvents = events.filter(e=>e.day===day).sort((a,b)=>a.s-b.s);
    if(!dayEvents.length) return;
    lines.push(`${day}:`);
    dayEvents.forEach(e=>lines.push(`  ${fmtHr(e.s)}–${fmtHr(e.e)}  ${e.t} (${e.p}, ${e.type})`));
  });
  toolState.calReport = lines;
  document.getElementById("calResult").innerHTML += `<button class="btn btn-navy btn-sm" style="margin-top:12px;" onclick="downloadCalendarPdf()">⬇ Download My Work</button>`;
  if(score===100) burstConfetti();
}
window.submitCalendar = submitCalendar;
async function downloadCalendarPdf(){
  await ensureTraineeName();
  const events = calMergedEvents();
  const remaining = calFindConflicts(events).length;
  const baseline = toolState.calBaseline || 1;
  const resolved = Math.max(0, baseline - remaining);
  const score = baseline===0 ? 100 : Math.round((resolved/baseline)*100);
  const lines = [`## Legal Calendar Conflict Resolver`, `Conflicts resolved: ${resolved} / ${baseline} (${score}%)`, "---", "## Final Weekly Schedule"];
  DAY_ORDER.forEach(day=>{
    const dayEvents = events.filter(e=>e.day===day).sort((a,b)=>a.s-b.s);
    if(!dayEvents.length) return;
    lines.push(`${day}:`);
    dayEvents.forEach(e=>lines.push(`   ${fmtHr(e.s)}–${fmtHr(e.e)}  ${e.t}  (${e.p} priority, ${e.type})`));
  });
  buildAndSavePdf("LSH EA / PA Upskill Program", "Weekly Calendar — Results", lines, "LSH_Calendar_Plan");
}
window.downloadCalendarPdf = downloadCalendarPdf;
function fmtHr(h){
  const hr = Math.floor(h), min = Math.round((h-hr)*60);
  const ampm = hr>=12?"PM":"AM";
  const hr12 = hr>12?hr-12:(hr===0?12:hr);
  return `${hr12}:${String(min).padStart(2,"0")}${ampm}`;
}

  const score = Math.round(((checked/total)*0.6 + (filled/TRAVEL_LEGS.length)*0.4)*100);
  document.getElementById("travelResult").innerHTML = `
    <div class="card" style="padding:16px 20px;margin-top:14px;">
      <b style="color:var(--navy);">Plan saved — ${checked}/${total} best practices checked, backup plans written for ${filled}/${TRAVEL_LEGS.length} legs.</b>
      <button class="btn btn-navy btn-sm" style="margin-top:12px;display:block;" onclick="downloadTravelPdf()">⬇ Download My Work</button>
    </div>`;
  await bumpPracticeProgress("travel", score);
  toast("Travel plan saved");

}

    fb.classList.add("show");

async function ensureTraineeName(){
  if(state.traineeName) return;
  await new Promise(resolve=>{
    const overlay=document.createElement("div");
    overlay.className="overlay";
    overlay.innerHTML=`
      <div class="card">

function drawPdfHeader(doc, title, subtitle){
  const navy=[38,43,69], orange=[219,132,55];
  const pageW = doc.internal.pageSize.getWidth();
  const marginX = 54;
  doc.setFillColor(...navy);
  doc.rect(0,0,pageW,86,"F");
  try{
    doc.addImage(LOGO_ICON_DATAURI, "PNG", marginX, 20, 46, 46);
  }catch(e){
    doc.setFillColor(...orange);
    doc.circle(marginX+16, 43, 15, "F");
    doc.setTextColor(255,255,255);
    doc.setFont("helvetica","bold"); doc.setFontSize(11);
    doc.text("LSH", marginX+16, 47, {align:"center"});
  }
  doc.setTextColor(255,255,255);
  doc.setFont("helvetica","bold"); doc.setFontSize(16);
  doc.text(title, marginX+58, 39);
  doc.setFont("helvetica","normal"); doc.setFontSize(10);
  doc.setTextColor(210,213,232);
  doc.text(subtitle, marginX+58, 56);
  doc.setTextColor(27,30,46);
}

/** Generic line-based report builder for Practice Lab downloads.
 *  Lines: plain strings (wrapped body text), "---" for a divider,
 *  or strings starting with "## " for a bold sub-heading. */
function buildAndSavePdf(title, subtitle, bodyLines, filenameBase){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"pt", format:"letter"});
  drawPdfHeader(doc, title, subtitle);
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const marginX = 54;
  let y = 118;
  doc.setTextColor(27,30,46);
  doc.setFont("helvetica","normal"); doc.setFontSize(10);
  doc.text(`Trainee: ${state.traineeName || "—"}`, marginX, y);
  doc.text(`Date: ${new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})}`, pageW-marginX, y, {align:"right"});
  y += 20;

  bodyLines.forEach(line=>{
    if(line==="---"){
      y+=4; doc.setDrawColor(220,224,234); doc.line(marginX,y,pageW-marginX,y); y+=14; return;
    }
    const isHeading = line.startsWith("## ");
    const text = isHeading ? line.slice(3) : line;
    doc.setFont("helvetica", isHeading?"bold":"normal");
    doc.setFontSize(isHeading?11.5:10);
    doc.setTextColor(...(isHeading?[38,43,69]:[27,30,46]));
    const wrapped = doc.splitTextToSize(text, pageW-marginX*2);
    wrapped.forEach(w=>{
      if(y>pageH-60){ doc.addPage(); y=60; }
      doc.text(w, marginX, y);
      y += isHeading?16:14;
    });
    if(isHeading) y+=2;
  });

  doc.setFontSize(8); doc.setTextColor(110,116,140);
  doc.text("LSH EA / PA Upskill Program — generated from this trainee's saved activity.", marginX, pageH-30);
  doc.save(`${filenameBase}_${(state.traineeName||"trainee").replace(/\s+/g,"_")}.pdf`);
  toast("Downloaded");
}

async function downloadRecordPdf(){
  await ensureTraineeName();

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"pt", format:"letter"});
  const navy = [38,43,69], soft=[110,116,140];
  const pageW = doc.internal.pageSize.getWidth();
  const marginX = 54;

  drawPdfHeader(doc, "LSH EA / PA Upskill Program", "Training Completion Record");

  let y = 118;
  doc.setTextColor(27,30,46);
  doc.setFont("helvetica","normal"); doc.setFontSize(10.5);
  doc.text(`Trainee: ${state.traineeName}`, marginX, y);
  doc.text(`Date Generated: ${new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})}`, pageW-marginX, y, {align:"right"});
  y += 8;
  doc.setDrawColor(220,224,234);
  doc.line(marginX, y, pageW-marginX, y);
  y += 26;

  const done = completedCount();
  const pct = Math.round((done/DAYS.length)*100);
  doc.setFont("helvetica","bold"); doc.setFontSize(12);
  doc.setTextColor(...navy);
  doc.text(`Overall Progress: ${done} of ${DAYS.length} days complete (${pct}%)`, marginX, y);
  y += 22;

  // table header
  doc.setFillColor(...navy);
  doc.rect(marginX, y, pageW-marginX*2, 22, "F");
  doc.setTextColor(255,255,255);
  doc.setFont("helvetica","bold"); doc.setFontSize(9.5);
  doc.text("DAY", marginX+8, y+14);
  doc.text("TOPIC", marginX+50, y+14);
  doc.text("STATUS", pageW-marginX-170, y+14);
  doc.text("SCORE", pageW-marginX-100, y+14);
  doc.text("DATE", pageW-marginX-46, y+14);
  y += 22;

  doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
  DAYS.forEach((d,i)=>{
    const prog = state.progress[d.id];
    const rowH = 24;
    if(i%2===0){ doc.setFillColor(244,245,249); doc.rect(marginX, y, pageW-marginX*2, rowH, "F"); }
    doc.setTextColor(27,30,46);
    doc.text(String(d.id), marginX+8, y+15);
    const topic = d.title.length>46 ? d.title.slice(0,44)+"…" : d.title;
    doc.text(topic, marginX+50, y+15);
    const status = prog&&prog.done ? "Completed" : "Not yet";
    doc.setTextColor(...(prog&&prog.done?[63,125,88]:soft));
    doc.text(status, pageW-marginX-170, y+15);
    doc.setTextColor(27,30,46);
    doc.text(prog&&typeof prog.score==="number" ? prog.score+"%" : "—", pageW-marginX-100, y+15);
    doc.text(prog&&prog.date ? new Date(prog.date).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"2-digit"}) : "—", pageW-marginX-46, y+15);
    y += rowH;
  });

  y += 26;
  doc.setDrawColor(220,224,234);
  doc.line(marginX, y, pageW-marginX, y);
  y += 20;
  doc.setFont("helvetica","bold"); doc.setFontSize(10.5);
  doc.setTextColor(...navy);
  doc.text("Practice Lab Activity", marginX, y);
  y += 18;
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
  doc.setTextColor(27,30,46);
  const pp = state.practiceProgress || {};
  if(PRACTICE_TOOLS.every(t=>!pp[t.id])){
    doc.setTextColor(...soft);
    doc.text("No Practice Lab activity recorded yet.", marginX, y);
    y+=16;
  } else {
    PRACTICE_TOOLS.forEach(t=>{
      const p = pp[t.id];
      if(!p) return;
      doc.text(`${t.title} — ${p.runs} run(s), best score ${p.bestScore||0}%`, marginX, y);
      y += 15;
    });
  }

  y += 30;
  doc.setDrawColor(200,204,218);
  doc.line(marginX, y, marginX+200, y);
  doc.setFontSize(9); doc.setTextColor(...soft);
  doc.text("Trainer signature", marginX, y+13);
  doc.line(pageW-marginX-200, y, pageW-marginX, y);
  doc.text("Date", pageW-marginX-200, y+13);

  doc.setFontSize(8); doc.setTextColor(...soft);
  doc.text("LSH EA / PA Upskill Program — generated automatically from this trainee's saved progress.", marginX, doc.internal.pageSize.getHeight()-30);

  const fname = `LSH_Training_Record_${state.traineeName.replace(/\s+/g,"_")}.pdf`;
  doc.save(fname);
  toast("Training Record downloaded");
}

const noteDebounceTimers = {};

function ensureDefaultNote(){
  if(!state.notes || state.notes.length===0){
    state.notes = [{id:"note_"+Date.now(), title:"My Action Plan", content:"", updatedAt:null, pinned:true}];
  }

function renderNotes(){
  ensureDefaultNote();
  return `
    <p class="eyebrow">Personal Workspace</p>
    <h1 style="color:var(--navy);font-size:26px;margin:6px 0 10px;">My Notes &amp; Action Plan</h1>
    <p style="color:var(--ink-soft);font-size:14.5px;max-width:70ch;margin:0 0 22px;">Jot down your action plan, takeaways, or anything else worth keeping. Notes save automatically to this device, and you can get quick AI feedback on quality, professionalism, and compliance before you finalize anything.</p>
    <div style="display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;">
      <button class="btn btn-primary" onclick="addNote()">+ Add Note</button>
      <button class="btn btn-ghost" onclick="downloadNotesPdf()">⬇ Download All Notes (PDF)</button>
    </div>
    <div id="notesList">
      ${state.notes.map(n=>renderNoteCard(n)).join("")}
    </div>
  `;
}

function renderNoteCard(n){
  return `
    <div class="card note-card" id="notecard_${n.id}">
      <div class="note-head">
        <input type="text" class="note-title-input" value="${esc(n.title)}" placeholder="Note title" oninput="onNoteChange('${n.id}','title',this.value)">
        ${n.pinned?'<span class="pill pill-open">Pinned</span>':`<button class="btn btn-sm btn-ghost" onclick="deleteNote('${n.id}')">Delete</button>`}
      </div>
      <textarea class="note-textarea" rows="7" placeholder="Write your action plan or notes here..." oninput="onNoteChange('${n.id}','content',this.value)">${esc(n.content)}</textarea>
      <div class="note-foot">
        <span class="note-saved" id="saved_${n.id}">${n.updatedAt?('Saved '+fmtDate(n.updatedAt)):'Not saved yet'}</span>
        <button class="btn btn-sm btn-navy" onclick="getAIFeedback('${n.id}')" id="aiBtn_${n.id}">✨ Get AI Feedback</button>
      </div>
      <div class="ai-feedback" id="aifeedback_${n.id}" style="display:none;"></div>
    </div>
  `;
}

function findNote(id){ return state.notes.find(n=>n.id===id); }

function onNoteChange(id, field, value){
  const n = findNote(id);
  if(!n) return;
  n[field] = value;
  const savedEl = document.getElementById(`saved_${id}`);
  if(savedEl) savedEl.textContent = "Saving…";
  clearTimeout(noteDebounceTimers[id]);
  noteDebounceTimers[id] = setTimeout(async ()=>{
    n.updatedAt = new Date().toISOString();
    const ok = await storeSet("notes", state.notes);
    const el = document.getElementById(`saved_${id}`);
    if(el) el.textContent = ok ? ("Saved "+fmtDate(n.updatedAt)) : "Couldn't save";
  }, 800); // debounced so we're not writing to storage on every keystroke
}
window.onNoteChange = onNoteChange;

async function addNote(){
  state.notes.push({id:"note_"+Date.now(), title:"New Note", content:"", updatedAt:new Date().toISOString(), pinned:false});
  await storeSet("notes", state.notes);
  render();
}
window.addNote = addNote;

async function deleteNote(id){
  state.notes = state.notes.filter(n=>n.id!==id);
  await storeSet("notes", state.notes);
  render();
}
window.deleteNote = deleteNote;

async function getAIFeedback(id){
  const n = findNote(id);
  if(!n) return;
  if(!n.content || n.content.trim().length<15){
    toast("Write a bit more before requesting feedback.");
    return;
  }
  const btn = document.getElementById(`aiBtn_${id}`);
  const fb = document.getElementById(`aifeedback_${id}`);
  btn.disabled = true; btn.textContent = "Reviewing…";
  fb.style.display = "block";
  fb.innerHTML = `<div class="ai-loading">Analyzing your note for quality, professionalism, and compliance…</div>`;

  const prompt = `You are reviewing a note written by a trainee in a Legal Executive Assistant / Personal Assistant training program at a company called Legal Support Help (LSH). The note may be an action plan, reflection, or general notes.

Evaluate the note against these standards taught in the program:
1. Clarity & Quality — is it specific and actionable, not vague?
2. Professionalism — is the tone and language appropriate for legal-office correspondence?
3. Compliance & Confidentiality awareness — does it reflect sound judgment about confidentiality, escalation, and professional boundaries (where relevant)?

Give concise, constructive feedback in 3-5 short bullet points, plus one overall takeaway sentence. Be encouraging but honest. Do not restate the note back verbatim. If the note is just a to-do list or personal reflection with no compliance angle, focus only on clarity and professionalism.

Note title: "${n.title}"
Note content:
"""
${n.content}
"""`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 600,
        messages: [{ role: "user", content: prompt }]
      })
    });
    if(!response.ok) throw new Error("Request failed: "+response.status);
    const data = await response.json();
    const text = (data.content||[]).map(b=>b.text||"").join("\n").trim();
    fb.innerHTML = text
      ? `<div class="ai-result"><b>AI Feedback</b><div class="ai-result-body">${esc(text).replace(/\n/g,"<br>")}</div></div>`
      : `<div class="ai-result"><b>AI Feedback</b><div class="ai-result-body">No feedback returned — try again in a moment.</div></div>`;
  }catch(e){
    fb.innerHTML = `<div class="ai-result ai-error"><b>Couldn't get feedback</b><div class="ai-result-body">The review service didn't respond. Check your connection and try again.</div></div>`;
  }finally{
    btn.disabled = false; btn.textContent = "✨ Get AI Feedback";
  }
}
window.getAIFeedback = getAIFeedback;

  const { jsPDF } = window.jspdf;
