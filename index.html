#app{position:relative;z-index:1;}

h1,h2,h3,h4,.display{font-family:'Fraunces',Georgia,serif;letter-spacing:-0.005em;font-weight:600;}
.mono{font-family:'IBM Plex Mono',monospace;letter-spacing:.02em;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--orange-soft);}

/* ---------- layout shell ---------- */
#app{min-height:100vh;display:flex;flex-direction:column;}

.notif-banner{
  background:linear-gradient(90deg, #FFF3E4 0%, #FDEBD8 100%);
  border-bottom:1px solid var(--orange-soft);
  padding:9px 24px;display:flex;align-items:center;justify-content:center;gap:14px;
  position:relative;font-size:var(--font-sub);color:var(--navy);
}
.notif-banner b{color:var(--orange-deep);}
.notif-banner .notif-close{
  position:absolute;right:18px;top:50%;transform:translateY(-50%);
  background:none;border:none;font-size:var(--font-body);color:var(--ink-soft);cursor:pointer;line-height:1;padding:4px;
}
.notif-banner .notif-close:hover{color:var(--navy);}

.topbar{
  background:var(--navy);
  color:#fff;
  position:-webkit-sticky;position:sticky;top:0;z-index:40;
  box-shadow:0 2px 16px rgba(0,0,0,.15);
}
.topbar-inner{
  max-width:1400px;margin:0 auto;padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  flex-wrap:wrap;row-gap:10px;
}
@media(min-width:960px){.topbar-inner{flex-wrap:nowrap;}}
.topbar-right{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex:1 1 auto;justify-content:flex-end;min-width:0;
}
@media(min-width:960px){.topbar-right{flex-wrap:nowrap;}}
.topbar-search{
  flex:1 1 140px;max-width:340px;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:20px;
  padding:8px 14px;position:relative;min-width:0;
}
.topbar-search input{
